 `html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Selection Guide</title>
    <style>
        :root {
            --bg-color: #fdf6f0;
            --card-bg: #ffffff;
            --primary-accent: #8da47e;
            --secondary-accent: #d4a373;
            --text-main: #5d574f;
            --text-light: #8e8881;
            --button-hover: #7a8f6b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #app-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: var(--secondary-accent);
            font-weight: 600;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        button {
            background-color: #fcfcfc;
            border: 2px solid #f0efed;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            font-weight: 500;
        }

        button:hover {
            border-color: var(--primary-accent);
            background-color: #f7faf5;
            transform: translateY(-2px);
        }

        button.primary {
            background-color: var(--primary-accent);
            color: white;
            border: none;
            margin-top: 20px;
            padding: 18px 30px;
        }

        button.primary:hover {
            background-color: var(--button-hover);
        }

        .result-container {
            animation: fadeIn 0.5s ease;
        }

        .cafe-name {
            font-size: 2.2rem;
            color: var(--primary-accent);
            margin: 15px 0;
            font-weight: 700;
        }

        .cafe-code {
            font-size: 0.85rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .progress-bar {
            height: 6px;
            width: 100%;
            background-color: #f0efed;
            margin-bottom: 35px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary-accent);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-link {
            display: block;
            margin-top: 25px;
            color: var(--text-light);
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            border: none;
            background: none;
            width: 100%;
        }

        .back-link:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
        <div id="content"></div>
    </div>
    <script>
        const logicData = {
            "Presentation run-through": {
                "Panic Mode": {
                    "Theory": { "Low": "Nero Cafe (NC7)", "Middle": "Nero Cafe (NC8)", "High": "Nero Cafe (NC9)" },
                    "Practical": { "Low": "Nero Cafe (NC10)", "Middle": "Nero Cafe (NC11)", "High": "Nero Cafe (NC12)" }
                },
                "Steady Pace": {
                    "Theory": { "Low": "Eye Opia (EO17)", "Middle": "Eye Opia (EO18)", "High": "Eye Opia (EO19)" },
                    "Practical": { "Low": "Eye Opia (EO20)", "Middle": "Eye Opia (EO21)", "High": "Eye Opia (EO22)" }
                },
                "Cruise Control": {
                    "Theory": { "Low": "Eye Opia (EO23)", "Middle": "Eye Opia (EO24)", "High": "Eye Opia (EO25)" },
                    "Practical": { "Low": "Eye Opia (EO26)", "Middle": "Eye Opia (EO27)", "High": "Eye Opia (EO28)" }
                }
            },
            "Intense Exam Prep": {
                "Panic Mode": {
                    "Theory": { "Low": "Fabi Cafe (FC1)", "Middle": "Fabi Cafe (FC2)", "High": "Cochem Cafe (CH1)" },
                    "Practical": { "Low": "Fabi Cafe (FC3)", "Middle": "Fabi Cafe (FC4)", "High": "Cochem Cafe (CH2)" }
                },
                "Steady Pace": {
                    "Theory": { "Low": "Fabi Cafe (FC7)", "Middle": "Fabi Cafe (FC8)", "High": "Cochem Cafe (CH3)" },
                    "Practical": { "Low": "Fabi Cafe (FC10)", "Middle": "Fabi Cafe (FC11)", "High": "Fabi Cafe (FC12)" }
                },
                "Cruise Control": {
                    "Theory": { "Low": "Fabi Cafe (FC13)", "Middle": "Fabi Cafe (FC14)", "High": "Cochem Cafe (CH5)" },
                    "Practical": { "Low": "Fabi Cafe (FC15)", "Middle": "Fabi Cafe (FC16)", "High": "Cochem Cafe (CH6)" }
                }
            },
            "Group Project": {
                "Panic Mode": {
                    "Theory": { "Low": "Nero Cafe (NC1)", "Middle": "Nero Cafe (NC2)", "High": "Nero Cafe (NC3)" },
                    "Practical": { "Low": "Nero Cafe (NC4)", "Middle": "Nero Cafe (NC5)", "High": "Nero Cafe (NC6)" }
                },
                "Steady Pace": {
                    "Theory": { "Low": "BBM Cafe (BBM1)", "Middle": "BBM Cafe (BBM2)", "High": "BBM Cafe (BBM3)" },
                    "Practical": { "Low": "BBM Cafe (BBM4)", "Middle": "BBM Cafe (BBM5)", "High": "BBM Cafe (BBM6)" }
                },
                "Cruise Control": {
                    "Theory": { "Low": "BBM Cafe (BBM7)", "Middle": "BBM Cafe (BBM8)", "High": "BBM Cafe (BBM9)" },
                    "Practical": { "Low": "BBM Cafe (BBM10)", "Middle": "BBM Cafe (BBM11)", "High": "BBM Cafe (BBM12)" }
                }
            },
            "Light Task": {
                "Steady Pace": {
                    "Theory": { "Low": "BBM Cafe (BBM13)", "Middle": "BBM Cafe (BBM14)", "High": "BBM Cafe (BBM15)" },
                    "Practical": { "Low": "BBM Cafe (BBM16)", "Middle": "BBM Cafe (BBM17)", "High": "BBM Cafe (BBM18)" }
                },
                "Cruise Control": {
                    "Theory": { "Low": "BBM Cafe (BBM19)", "Middle": "BBM Cafe (BBM20)", "High": "BBM Cafe (BBM21)" },
                    "Practical": { "Low": "BBM Cafe (BBM22)", "Middle": "BBM Cafe (BBM23)", "High": "BBM Cafe (BBM24)" }
                },
                "Panic Mode": {
                    "Theory": { "Low": "Nero Cafe (NC13)", "Middle": "Nero Cafe (NC14)", "High": "Nero Cafe (NC15)" },
                    "Practical": { "Low": "Nero Cafe (NC16)", "Middle": "Nero Cafe (NC17)", "High": "Nero Cafe (NC18)" }
                }
            }
        };

        let state = { goal: null, time: null, lessonType: null, budget: null, energy: null, step: 0 };
        const questions = [
            { id: 'goal', text: "What are you here for today?", options: ["Presentation run-through", "Group Project", "Light Task", "Intense Exam Prep"] },
            { id: 'time', text: "What's the timeline looking like?", options: ["Panic Mode", "Steady Pace", "Cruise Control"] },
            { id: 'lessonType', text: "What's the focus of your work?", options: ["Theory", "Practical"] },
            { id: 'budget', text: "What's your budget for today?", options: ["Low", "Middle", "High"] },
            { id: 'energy', text: "How's your current energy level?", options: ["High", "Low"] }
        ];

        function render() {
            const content = document.getElementById('content');
            const progress = document.getElementById('progress');
            
            if (state.step < questions.length) {
                const q = questions[state.step];
                progress.style.width = ${(state.step / questions.length) * 100}%;
                
                content.innerHTML = 
                    <div class="question-container" style="animation: fadeIn 0.3s ease-out">
                        <p class="question-text">${q.text}</p>
                        <div class="options-grid">
                            ${q.options.map(opt => <button onclick="handleSelect('${opt}')">${opt}</button>).join('')}
                        </div>
                        ${state.step > 0 ? <button class="back-link" onclick="goBack()">← Back to previous question</button> : ''}
                    </div>
                ;
            } else {
                showResult();
            }
        }

        function handleSelect(option) {
            const key = questions[state.step].id;
            state[key] = option;
            state.step++;
            render();
        }

        function goBack() {
            if (state.step > 0) {
                state.step--;
                render();
            }
        }

        function showResult() {
            const progress = document.getElementById('progress');
            progress.style.width = '100%';

            let recommendation = "";
            try {
                const level1 = logicData[state.goal];
                const level2 = level1[state.time];
                const level3 = level2[state.lessonType];
                recommendation = level3[state.budget];
            } catch (e) {
                // Logic fallback to BBM or Fabi if a specific path isn't perfectly defined in text
                recommendation = state.goal === "Light Task" || state.goal === "Group Project" ? "BBM Cafe (BBM)" : "Fabi Cafe (FC)";
            }

            content.innerHTML = 
                <div class="result-container">
                    <p class="question-text">The perfect cozy spot for you is:</p>
                    <div class="cafe-code">MATCHED CAFE</div>
                    <div class="cafe-name">${recommendation}</div>
                    <p style="margin-top: 20px; color: var(--text-light); line-height: 1.6;">
                        Ideal for a <strong>${state.goal.toLowerCase()}</strong> in <strong>${state.time.toLowerCase()}</strong>.<br>
                        Focus: ${state.lessonType} | Energy: ${state.energy}
                    </p>
                    <button class="primary" onclick="reset()">Start Search Again</button>
                </div>
            ;
        }

        function reset() {
            state = { goal: null, time: null, lessonType: null, budget: null, energy: null, step: 0 };
            render();
        }

        window.onload = render;
    </script>
</body>
</html>

`
