 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Selection Guide</title>
    <style>
        :root {
            --bg-color: #fcf8f5;
            --container-bg: #ffffff;
            --text-main: #2d2d2d;
            --text-light: #666666;
            --accent: #d4a373;
            --progress-bg: #e9ecef;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        #app-container {
            background: var(--container-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--progress-bg);
            border-radius: 10px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .options-grid {
            display: grid;
            gap: 10px;
        }

        button {
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        button:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .cafe-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            margin: 15px 0;
        }

        .back-link {
            margin-top: 20px;
            display: block;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            border: none;
            background: none;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="progress-bar">
            <div id="progress" class="progress-fill"></div>
        </div>
        <div id="content"></div>
    </div>

<script>
    const logicData = {
        "Presentation run-through": {
            "Panic Mode": {
                "Theory": { "Low": "Nero Cafe (NC7)", "Middle": "Nero Cafe (NC8)", "High": "Nero Cafe (NC9)" },
                "Practical": { "Low": "Nero Cafe (NC10)", "Middle": "Nero Cafe (NC11)", "High": "Nero Cafe (NC12)" }
            },
            "Steady Pace": {
                "Theory": { "Low": "Eye Opia (E017)", "Middle": "Eye Opia (E018)", "High": "Eye Opia (E019)" },
                "Practical": { "Low": "Eye Opia (E020)", "Middle": "Eye Opia (E021)", "High": "Eye Opia (E022)" }
            }
        },
        "Intense Exam Prep": {
            "Panic Mode": {
                "Theory": { "Low": "Fabi Cafe (FC1)", "Middle": "Fabi Cafe (FC2)", "High": "Fabi Cafe (FC3)" },
                "Practical": { "Low": "Fabi Cafe (FC4)", "Middle": "Fabi Cafe (FC5)", "High": "Fabi Cafe (FC6)" }
            },
            "Steady Pace": {
                "Theory": { "Low": "BBM Cafe (BBM1)", "Middle": "BBM Cafe (BBM2)", "High": "BBM Cafe (BBM3)" },
                "Practical": { "Low": "BBM Cafe (BBM4)", "Middle": "BBM Cafe (BBM5)", "High": "BBM Cafe (BBM6)" }
            }
        },
        "Light Task": { "Panic Mode": "BBM Cafe", "Steady Pace": "Fabi Cafe" },
        "Group Project": { "Panic Mode": "Nero Cafe", "Steady Pace": "Eye Opia" }
    };

    let state = { step: 0, goal: null, time: null, lessonType: null, budget: null };

    const questions = [
        { id: 'goal', text: "What's your main goal today?", options: ["Presentation run-through", "Intense Exam Prep", "Light Task", "Group Project"] },
        { id: 'time', text: "How much time do you have?", options: ["Panic Mode", "Steady Pace"] },
        { id: 'lessonType', text: "What's the nature of your work?", options: ["Theory", "Practical"] },
        { id: 'budget', text: "What's your budget for today?", options: ["Low", "Middle", "High"] }
    ];

    function render() {
        const content = document.getElementById('content');
        const progress = document.getElementById('progress');
        
        if (state.step < questions.length) {
            const q = questions[state.step];
            progress.style.width = `${(state.step / questions.length) * 100}%`;
            
            content.innerHTML = `
                <div class="question-container">
                    <p class="question-text">${q.text}</p>
                    <div class="options-grid">
                        ${q.options.map(opt => `<button onclick="handleSelect('${opt}')">${opt}</button>`).join('')}
                    </div>
                    ${state.step > 0 ? `<button class="back-link" onclick="goBack()">← Back</button>` : ''}
                </div>
            `;
        } else {
            showResult();
        }
    }

    function handleSelect(option) {
        const key = questions[state.step].id;
        state[key] = option;

        if (state.step === 0 && (option === "Light Task" || option === "Group Project")) {
            state.step = 1; 
        } else {
            state.step++;
        }
        render();
    }

    function goBack() {
        if (state.step > 0) {
            state.step--;
            render();
        }
    }

    function showResult() {
        const content = document.getElementById('content');
        const progress = document.getElementById('progress');
        progress.style.width = '100%';

        let recommendation = "";
        try {
            if (state.goal === "Light Task" || state.goal === "Group Project") {
                recommendation = logicData[state.goal][state.time] || "BBM Cafe";
            } else {
                recommendation = logicData[state.goal][state.time][state.lessonType][state.budget];
            }
        } catch (e) {
            recommendation = "Fabi Cafe (FC)";
        }

        content.innerHTML = `
            <div class="result-container">
                <p class="question-text">The perfect cozy spot for you is:</p>
                <div class="cafe-name">${recommendation}</div>
                <button class="back-link" style="border:1px solid #ddd; padding:10px; border-radius:10px" onclick="reset()">Start Again</button>
            </div>
        `;
    }

    function reset() {
        state = { step: 0, goal: null, time: null, lessonType: null, budget: null };
        render();
    }

    render(); 
</script>
</body>
</html>
